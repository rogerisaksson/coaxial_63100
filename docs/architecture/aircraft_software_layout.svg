<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 685" width="100%" height="100%">
<rect width="1280" height="685" rx="10" fill="#020617"/>
<g font-family="monospace">
<text x="24" y="34" fill="#f8fafc" font-size="16" font-weight="bold">COAXIAL 63100 -- Aircraft Flight Stack &amp; Real-Time SO(3) Control Architecture</text>
<text x="24" y="54" fill="#94a3b8" font-size="11">5-Layer Pipeline: Terminal UI (60 Hz) &lt;-&gt; Sensing &amp; Weather &lt;-&gt; Trajectory &amp; Wingborne &lt;-&gt; SO(3) Laws (240-500 Hz) &lt;-&gt; C Harness &amp; 63100 Drives</text>
<rect x="20" y="150" width="205" height="295" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
<text x="32" y="176" fill="#38bdf8" font-size="12" font-weight="bold">FLIGHT ORCHESTRATOR</text>
<text x="32" y="194" fill="#e2e8f0" font-size="10">views.flying / apart</text>
<text x="32" y="210" fill="#94a3b8" font-size="10">Sky + Law + CoaxialDrives</text>
<line x1="32" y1="222" x2="213" y2="222" stroke="#334155" stroke-width="1"/>
<text x="32" y="240" fill="#f8fafc" font-size="10" font-weight="bold">Shared State &amp; Payloads:</text>
<text x="32" y="258" fill="#38bdf8" font-size="9">cmd / frames  IPC (60 Hz)</text>
<text x="32" y="276" fill="#a78bfa" font-size="9">seen[state]   senses.told</text>
<text x="32" y="294" fill="#a78bfa" font-size="9">air[wx,wy,wz] weather.wind_at</text>
<text x="32" y="312" fill="#34d399" font-size="9">payload[66B]  aerolisp/aerokin</text>
<text x="32" y="330" fill="#34d399" font-size="9">alpha, pull   wingborne.plane</text>
<text x="32" y="348" fill="#fbbf24" font-size="9">acc, target_R helicopter.kit</text>
<text x="32" y="366" fill="#fbbf24" font-size="9">w[4], ctrl[4] aero/ &amp; laws</text>
<text x="32" y="384" fill="#f472b6" font-size="9">aeh_world_t   10x RK2 substep</text>
<text x="32" y="402" fill="#f472b6" font-size="9">15S 63 V LiPo  60-90 A 63100</text>
<text x="32" y="424" fill="#94a3b8" font-size="9">0 direct qpos/qvel hacks</text>
</g>
<g font-family="monospace">
<path d="M 225 295 L 255 130" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
<line x1="255" y1="130" x2="1256" y2="130" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,3"/>
<rect x="255" y="102" width="350" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
<text x="263" y="116" fill="#38bdf8" font-size="11" font-weight="bold">LAYER 1: terminal, views &amp; flight worker (60 Hz)</text>
<line x1="357" y1="130" x2="357" y2="142" stroke="#38bdf8" stroke-width="1.8"/>
<rect x="265" y="142" width="184" height="62" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
<text x="273" y="156" fill="#f8fafc" font-size="10" font-weight="bold">#1 show_&lt;craft&gt;.py</text>
<text x="273" y="171" fill="#94a3b8" font-size="9">quad / heli / orni / aerobat</text>
<text x="273" y="185" fill="#cbd5e1" font-size="9">chase &amp; spectator cam</text>
<text x="273" y="198" fill="#38bdf8" font-size="9">out: mode, weather, card</text>
<line x1="557" y1="130" x2="557" y2="142" stroke="#38bdf8" stroke-width="1.8"/>
<rect x="465" y="142" width="184" height="62" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
<text x="473" y="156" fill="#f8fafc" font-size="10" font-weight="bold">#2 views/flying.py</text>
<text x="473" y="171" fill="#94a3b8" font-size="9">Flying subprocess worker</text>
<text x="473" y="185" fill="#cbd5e1" font-size="9">playback.py LAG_S = 60 ms</text>
<text x="473" y="198" fill="#38bdf8" font-size="9">in: 60 Hz state snapshots</text>
<line x1="757" y1="130" x2="757" y2="142" stroke="#38bdf8" stroke-width="1.8"/>
<rect x="665" y="142" width="184" height="62" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
<text x="673" y="156" fill="#f8fafc" font-size="10" font-weight="bold">#3 aerolisp.py &amp; *.lisp</text>
<text x="673" y="171" fill="#94a3b8" font-size="9">4 craft manifests + shared</text>
<text x="673" y="185" fill="#cbd5e1" font-size="9">stream_inject &amp; defblock</text>
<text x="673" y="198" fill="#38bdf8" font-size="9">out: CompiledAeroPayload</text>
<line x1="957" y1="130" x2="957" y2="142" stroke="#38bdf8" stroke-width="1.8"/>
<rect x="865" y="142" width="184" height="62" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
<text x="873" y="156" fill="#f8fafc" font-size="10" font-weight="bold">#4 grounds &amp; airfield</text>
<text x="873" y="171" fill="#94a3b8" font-size="9">gates, limbo, hoop, slalom</text>
<text x="873" y="185" fill="#cbd5e1" font-size="9">L1 arcs &amp; sweep.py</text>
<text x="873" y="198" fill="#38bdf8" font-size="9">out: laid lines &amp; solids</text>
<line x1="1157" y1="130" x2="1157" y2="142" stroke="#38bdf8" stroke-width="1.8"/>
<rect x="1065" y="142" width="184" height="62" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
<text x="1073" y="156" fill="#f8fafc" font-size="10" font-weight="bold">#5 coaxial/ &amp; rig.py</text>
<text x="1073" y="171" fill="#94a3b8" font-size="9">0x6E wire / device 14 aero</text>
<text x="1073" y="185" fill="#cbd5e1" font-size="9">motion.spun &amp; started</text>
<text x="1073" y="198" fill="#38bdf8" font-size="9">Kalman &amp; thermal twin</text>
</g>
<g font-family="monospace">
<path d="M 225 295 L 255 244" stroke="#a78bfa" stroke-width="2.5" fill="none"/>
<line x1="255" y1="244" x2="1256" y2="244" stroke="#a78bfa" stroke-width="3" stroke-dasharray="6,3"/>
<rect x="255" y="216" width="350" height="20" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
<text x="263" y="230" fill="#a78bfa" font-size="11" font-weight="bold">LAYER 2: sensing, weather &amp; observers (240-500 Hz)</text>
<line x1="357" y1="244" x2="357" y2="256" stroke="#a78bfa" stroke-width="1.8"/>
<rect x="265" y="256" width="184" height="62" rx="5" fill="#1e293b" stroke="#a78bfa" stroke-width="1.3"/>
<text x="273" y="270" fill="#f8fafc" font-size="10" font-weight="bold">#1 senses.py (eyes)</text>
<text x="273" y="285" fill="#94a3b8" font-size="9">BMI055 IMU + 20 Hz RTK</text>
<text x="273" y="299" fill="#cbd5e1" font-size="9">5 Hz star camera backup</text>
<text x="273" y="312" fill="#a78bfa" font-size="9">out: seen(at,vel,turn,spin)</text>
<line x1="557" y1="244" x2="557" y2="256" stroke="#a78bfa" stroke-width="1.8"/>
<rect x="465" y="256" width="184" height="62" rx="5" fill="#1e293b" stroke="#a78bfa" stroke-width="1.3"/>
<text x="473" y="270" fill="#f8fafc" font-size="10" font-weight="bold">#2 weather.py (wind_at)</text>
<text x="473" y="285" fill="#94a3b8" font-size="9">Dryden gusts &amp; eddies</text>
<text x="473" y="299" fill="#cbd5e1" font-size="9">calm / breeze / gale / tour</text>
<text x="473" y="312" fill="#a78bfa" font-size="9">out: air(wx, wy, wz)</text>
<line x1="757" y1="244" x2="757" y2="256" stroke="#a78bfa" stroke-width="1.8"/>
<rect x="665" y="256" width="184" height="62" rx="5" fill="#1e293b" stroke="#a78bfa" stroke-width="1.3"/>
<text x="673" y="270" fill="#f8fafc" font-size="10" font-weight="bold">#3 aero.c ESO (quad)</text>
<text x="673" y="285" fill="#94a3b8" font-size="9">3-axis attitude &amp; pull ESO</text>
<text x="673" y="299" fill="#cbd5e1" font-size="9">wind vs push separation</text>
<text x="673" y="312" fill="#a78bfa" font-size="9">in: aero_sense_t (500 Hz)</text>
<line x1="957" y1="244" x2="957" y2="256" stroke="#a78bfa" stroke-width="1.8"/>
<rect x="865" y="256" width="184" height="62" rx="5" fill="#1e293b" stroke="#a78bfa" stroke-width="1.3"/>
<text x="873" y="270" fill="#f8fafc" font-size="10" font-weight="bold">#4 observer.py (heli/orni)</text>
<text x="873" y="285" fill="#94a3b8" font-size="9">SO(3) turn_eso (wo=35)</text>
<text x="873" y="299" fill="#cbd5e1" font-size="9">pull_eso &amp; wind_eso</text>
<text x="873" y="312" fill="#a78bfa" font-size="9">in: seen &amp; controls (240 Hz)</text>
<line x1="1157" y1="244" x2="1157" y2="256" stroke="#a78bfa" stroke-width="1.8"/>
<rect x="1065" y="256" width="184" height="62" rx="5" fill="#1e293b" stroke="#a78bfa" stroke-width="1.3"/>
<text x="1073" y="270" fill="#f8fafc" font-size="10" font-weight="bold">#5 aerobat/observer.py</text>
<text x="1073" y="285" fill="#94a3b8" font-size="9">SO(3) turn_eso (wo=35)</text>
<text x="1073" y="299" fill="#cbd5e1" font-size="9">slipstream &amp; pull_eso</text>
<text x="1073" y="312" fill="#a78bfa" font-size="9">out: d_tau, d_pull</text>
</g>
<g font-family="monospace">
<path d="M 225 295 L 255 358" stroke="#34d399" stroke-width="2.5" fill="none"/>
<line x1="255" y1="358" x2="1256" y2="358" stroke="#34d399" stroke-width="3" stroke-dasharray="6,3"/>
<rect x="255" y="330" width="350" height="20" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
<text x="263" y="344" fill="#34d399" font-size="11" font-weight="bold">LAYER 3: trajectory, kinematics &amp; guidance (240-500 Hz)</text>
<line x1="357" y1="358" x2="357" y2="370" stroke="#34d399" stroke-width="1.8"/>
<rect x="265" y="370" width="184" height="62" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.3"/>
<text x="273" y="384" fill="#f8fafc" font-size="10" font-weight="bold">#1 aerobatics.py &amp; cards</text>
<text x="273" y="399" fill="#94a3b8" font-size="9">HOVER + figure setpoints</text>
<text x="273" y="413" fill="#cbd5e1" font-size="9">routines &amp; gate courses</text>
<text x="273" y="426" fill="#34d399" font-size="9">out: row(pos,vel,lean,rates)</text>
<line x1="557" y1="358" x2="557" y2="370" stroke="#34d399" stroke-width="1.8"/>
<rect x="465" y="370" width="184" height="62" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.3"/>
<text x="473" y="384" fill="#f8fafc" font-size="10" font-weight="bold">#2 aerokin.py (vacuum)</text>
<text x="473" y="399" fill="#94a3b8" font-size="9">branch-free quad kinematics</text>
<text x="473" y="413" fill="#cbd5e1" font-size="9">collective + tilt + rates</text>
<text x="473" y="426" fill="#34d399" font-size="9">out: AeroPayload (500 Hz)</text>
<line x1="757" y1="358" x2="757" y2="370" stroke="#34d399" stroke-width="1.8"/>
<rect x="665" y="370" width="184" height="62" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.3"/>
<text x="673" y="384" fill="#f8fafc" font-size="10" font-weight="bold">#3 course.py &amp; airfield.py</text>
<text x="673" y="399" fill="#94a3b8" font-size="9">L1 arc guidance &amp; gates</text>
<text x="673" y="413" fill="#cbd5e1" font-size="9">runway takeoff &amp; flare</text>
<text x="673" y="426" fill="#34d399" font-size="9">out: path row &amp; trigger</text>
<line x1="957" y1="358" x2="957" y2="370" stroke="#34d399" stroke-width="1.8"/>
<rect x="865" y="370" width="184" height="62" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.3"/>
<text x="873" y="384" fill="#f8fafc" font-size="10" font-weight="bold">#4 wingborne.py (plane)</text>
<text x="873" y="399" fill="#94a3b8" font-size="9">post-stall + flat-plate lift</text>
<text x="873" y="413" fill="#cbd5e1" font-size="9">10-step alpha bisection</text>
<text x="873" y="426" fill="#34d399" font-size="9">out: alpha, target_R, pull</text>
<line x1="1157" y1="358" x2="1157" y2="370" stroke="#34d399" stroke-width="1.8"/>
<rect x="1065" y="370" width="184" height="62" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.3"/>
<text x="1073" y="384" fill="#f8fafc" font-size="10" font-weight="bold">#5 helicopter/kit.py</text>
<text x="1073" y="399" fill="#94a3b8" font-size="9">shared SO(3) track &amp; step</text>
<text x="1073" y="413" fill="#cbd5e1" font-size="9">hover, orbit &amp; line track</text>
<text x="1073" y="426" fill="#34d399" font-size="9">out: acc_cmd, target_R</text>
</g>
<g font-family="monospace">
<path d="M 225 295 L 255 472" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
