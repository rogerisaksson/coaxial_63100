# A runner probe on a temporary branch, never merged: her C hand ports' dots through numpy's OpenBLAS and
# numpy's AVX-512 dispatch off - her twins and her ports beside their python on each runner.
name: host

on:
  push:
    branches: [probe-twins]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
        seat: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/inputs
        with:
          apt: libegl1 libgl1-mesa-dri
          requirements: host/requirements.txt
          constraints: host/constraints.txt
          editable: host
      - name: as it is
        shell: bash
        working-directory: host
        run: |
          python -X utf8 -c "import numpy._core._multiarray_umath as m; print('dispatch:', ' '.join(m.__cpu_dispatch__))"
          python -X utf8 -c "from tools.dev import probe_twins as p; p.processor()"
      - name: hooks
        shell: bash
        working-directory: host
        env:
          MUJOCO_GL: egl
          NPY_DISABLE_CPU_FEATURES: X86_V4 AVX512_ICL AVX512_SPR
        run: python -X utf8 tools/dev/probe_twins.py
