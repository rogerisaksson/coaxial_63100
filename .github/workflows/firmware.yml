# The firmware, built on every push with the same presets the bench uses -
# `cmake --preset <name>`, then the build preset - on Arm's own GCC 14, the
# major the ST bundle ships.
name: firmware

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write        # the failure step posts the log tail as a commit comment

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'
      - run: sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      # Zero warnings is the bench's rule (CLAUDE.md), so it is the runner's.
      - run: |
          if grep -n "warning:" build.log; then
            echo "the build must be warning-free"; exit 1
          fi
        shell: bash
      # Both images: the application, and the bootloader it arrives through
      # (docs/BOOT.md) - each sized, both kept.
      - run: arm-none-eabi-size build/${{ matrix.preset }}/coaxial_63100.elf build/${{ matrix.preset }}/coaxial_63100_boot.elf
      - uses: actions/upload-artifact@v4
        with:
          name: coaxial_63100-${{ matrix.preset }}-elf
          path: |
            build/${{ matrix.preset }}/coaxial_63100.elf
            build/${{ matrix.preset }}/coaxial_63100_boot.elf
      # The image itself on Renode's STM32H753 (board/emu): the conformance suite and the
      # wire sweeps against the ELF, CubeMX's code and the HAL included.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: host/requirements.txt
      - run: pip install -r host/requirements.txt && pip install --no-deps -e host
      - run: |
          curl -sL https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz | tar xz
          echo "RENODE=$PWD/$(ls -d renode_*/ | head -1)renode" >> "$GITHUB_ENV"
        shell: bash
      - run: python -X utf8 tests/test_emulator.py 2>&1 | tee -a ../build.log; exit ${PIPESTATUS[0]}
        shell: bash
        working-directory: host
        env:
          COAXIAL_ELF: ../build/${{ matrix.preset }}/coaxial_63100.elf
          COAXIAL_EMULATOR: required
      # A red run must be readable without the Actions UI, like the host's.
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 build.log > tail.log 2>/dev/null || true
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(printf 'CI firmware (%s) failed. Log tail:\n\n~~~\n' '${{ matrix.preset }}'; cat tail.log; printf '\n~~~\n')" \
            || true
