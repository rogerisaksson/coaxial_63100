# Physical, electromechanical and aerodynamic construction of every craft and variant
# (`mechatronics.crafts()`, compiled by `machine.aircraft.compile`): each craft its own laid on
# `[shared]`, a variant (`extends`) on its craft.
# All thrust/drag/flap polars, blade and airframe inertias, control moment arms, drive load polars,
# heatsink curves, governor speeds, attitude impedances, ESO bandwidths and trajectory envelopes are
# derived statically by `machine.aircraft.polars`, `machine.aircraft.compile` and `machine.solver`.

# What every craft has unless it states its own: its drive, its frame's mass and its heavy frame's
# (kg), its body's drag area, the inflow's shares, a foot's radius and the camera's gimbal.
[shared]
motor = "outrunner_63100_14p"
inverter = "coaxial_63100"
mass_kg = 2.0
heavy_kg = 2.5
parasite_cda = 0.15
inflow_j0 = 1.05
inflow_floor = 0.35
foot_r_m = 0.015

[shared.gimbal]
mount = [0.0, -0.07, 0.12]
tilt_deg = 8.0
tilts_deg = [-70.0, 35.0]

