# Her gait (machine.body.gait): her law's numbers as they work on her, each with what it was found
# at, stated at her leg `leg_m` (thigh and shank, m). A build of another leg has each Froude-similar
# by its unit - a length as the leg, a time or a speed as its root, a rate as its inverse root, per
# s^2 as its inverse, an angle, a share or a force as it is -, nothing of them tuned to it.
[gait]
leg_m = 0.77

# Her modes' units and her limbs' rest (machine.law.modal).
[gait.modes]
# A unit of her centre of mass down, m - to her ankles' stroke, her trunk upright over her soles: asked
# 0.15 m she came down 0.117 and stood there; of her trunk's pitch, rad; of a sole clear of the floor, m
# - at 3 cm her walk fell within 20 s in 10 of 12 settings, at 2 cm in 5 of 12 (45 s each).
axial_m = 0.115
pitch_rad = 0.5
clear_m = 0.02
# And of her turns, rad: her pelvis's list, a hip up, and its turn, a hip forward; a shoulder's reach,
# the other as far back, and an elbow's bend.
list_rad = 0.15
turn_rad = 0.2
arm_rad = 0.35
# At rest: along the floor the capture point's law, its ZMP this over omega past her capture point
# from where it is asked - a spring this times omega and a damper omega and this over her mass, 1/s.
rest_1_s = 2.0
# A limb in the air at rest, 1/s^2 and 1/s. One sole bears what moves it: her weight on a sole 9 cm
# wide turns her 13 N m at most, a limb thrown across at 4 m/s^2 or lifted at 8. Held at the loop's
# own 1 600 and 80, a sole 6 cm off its width asked 163 m/s^2 across, the loop planned -10 - the
# lift's 23 m/s^2 took the moment - and threw her neck at three times its clamp for the rest.
limb_1_s2 = 400.0
limb_1_s = 40.0

# Her whole-body loop (machine.stack.wbc).
[gait.loop]
# The friction pyramid's slope, inside the soles' elliptic cone of `mjcf.FRICTION` 1.0; a standing
# corner presses at least `f_min_n`.
mu = 0.6
f_min_n = 0.0
# A contact slides past this slip: a sole's grip reads it so (`grip`), a pressing contact's point its
# regime (`rounds.pushed`) - on the ice a sole pushing off slid back 0.3 m in 0.05 s before her law
# asked less.
slide_m_s = 0.15
# A sole's centre of pressure `margin_m` inside its edge, softly (weight `slack` against the centre of
# mass's m/s^2).
margin_m = 0.015
slack = 1e3
# Her vertical acceleration within this of her height's ask on the balance's level, her height itself
# under the turns and a swing.
height_band_m_s2 = 3.0
# A stop met no nearer than `stop_rad`, `limit_s` ahead at the acceleration asked.
limit_s = 0.05
stop_rad = 0.01
# A standing sole's slip bled at `contact_1_s`; a held joint's (`drives.passive` None) at `held_1_s`.
contact_1_s = 20.0
held_1_s = 50.0
# A drive asked no more than `clamp_share` of its clamp as its board derates it - past it, to the
# stack's own peak at its board's amps (`drives.peak`), only granted war emergency power (the board's
# derate held off, `thermal.wep`) and only where the centre of mass asks it; the soft rows laid for
# the drives that bore more than `near` of their clamps the step before.
clamp_share = 0.95
near = 0.6
# The turns', the posture's and a swinging sole's springs and dampers, 1/s^2 and 1/s (a swinging
# sole's at 400 and 40 a 0.2 s step lagged its path 11 cm, 100 N); the angular momentum bled at
# `momentum_1_s` - at 10 on the level under the centre of mass it pinned both soles' centres of
# pressure to their edges, flipping each 50 ms (a 60 N shove); her centre of mass's height held by
# its own.
turn_1_s2 = 100.0
turn_1_s = 20.0
posture_1_s2 = 100.0
posture_1_s = 20.0
swing_1_s2 = 1600.0
swing_1_s = 80.0
momentum_1_s = 3.0
height_1_s2 = 100.0
height_1_s = 20.0
# The turns' weight against a swinging sole's m/s^2; her form's against the posture's rad/s^2: the
# angular momentum's N m, the torques' (a clamp's share), the corners' forces (her weight's share),
# her height's m/s^2; a swinging knee's fold's against its sole's m/s^2.
turn_w = 3.0
momentum_w = 0.3
posture_w = 1.0
torque_w = 3.0
force_w = 1.0
height_w = 1.0
fold_w = 0.3

# Her touch and her leaps (machine.moves.leap).
[gait.leap]
# A sole bears at `touch_n`, lies on the floor within `touch_m`; she rests under `rest_m_s`. Kept
# standing within its sole's give instead (5 mm, a sole that stood only too) the run's leap fell 0.69
# -> 0.30 m and the seats went: a sole 2 mm up has left. Near alone, the stack pressed a sole 1 mm over
# the floor onto it as she left: 648 N on it, 23 deg over. All or none while she rises flickered on
# one sole: 21 deg over three hops.
touch_n = 15.0
touch_m = 0.002
rest_m_s = 0.1
# A sole in the air waits for the floor with its hip `land_drop_m` under the leg's length over it -
# the knee 25 deg -, no straighter than `land_short_m` short of that length where drawn.
land_drop_m = 0.018
land_short_m = 0.004
# Her standing jump as the human's (`takes.jump`, test_leap holds them to it): the s his crouch takes
# and his take-off comes at; the crouch he pushes from and his trunk's lean there, axial and pitch;
# his stand at take-off, axial, and his legs' lengthening there, axial/s.
crouch_s = 0.465
takeoff_s = 0.745
crouch = 2.18
lean = 1.70
straight = 0.11
leaves_1_s = 11.7

# Her stride (machine.law.stride).
[gait.stride]
# A unit of her drive, a limb's place from her centre of mass along her way, m; of her soles' rock,
# a sole's pitch, rad.
stride_m = 0.3
rock_rad = 0.5
# Her drive's amplitude over `stirs`, she strides: a limb swings `swing` of a turn, a woman's 38 to
# 40 %. Let go only with her ZMP in the other sole, a step was no longer than a sole - 0.23 legs at
# 0.28 m/s, a shuffle by name (`tools.sim.normal`).
stirs = 0.02
swing = 0.4
# Her sway a quarter turn behind her drive, past `back` of it, she goes the other way.
back = 0.5
# Her centre of mass asked no more than this faster or slower than her soles have made of late, m/s.
ahead_m_s = 0.36
# A striding sole lands no further than `reach_m` from her along her way, `apart_m` and more its own
# side of the other; its spring stiffens till `soon_s` before it is there. It is up over the first
# `rise_u` of its swing, comes down over the last `fall_u` and is over its landing `arrive_u` through it.
reach_m = 0.35
apart_m = 0.1
soon_s = 0.02
rise_u = 0.2
fall_u = 0.25
arrive_u = 0.9
# A landing further on by this of her speed past her cruise, over omega. A step's push - her centre
# of mass past the standing sole's ball till the next lands - is 0.14 m/s more than its landing's
# brake at any speed, and the landing's blow took that: on a step that lands softer she was down at
# 19 s with no lead, at 36 s with 0.25. With 0.5 a step leaves 0.42 of its speed's error to the
# next, with 1 it turns it -0.09.
leads = 0.5
# Past its swing a sole not down reaches on down at `reach_m_s`, for `reach_s` at most.
reach_m_s = 0.45
reach_s = 0.25
# A standing sole is turned about the edge it stands on, 1/s^2: flat, or over its ball as its stride
# has it. The loop's own hold on a standing sole damps its turn at 20 /s: stood on with its heel 4
# deg up, it stayed on its ball for 3 s. At 100 /s^2 and her ZMP let anywhere under it, a heel asked
# 6 deg up under all of her stayed down till the other sole landed.
flat_1_s2 = 400.0
# A standing sole's heel rises no further than `heel_deg`, a woman's as her toes leave (the
# reference take's heel at lift, `tools/sim/mocap.py tests/takes/walk.fbx`) - at 0.6 rad, a swung
# leg damped as the master insert has it, she walked on stilts; at the band's 62 deg her sprint,
# stutter, rug and snow fell -, no faster than `heel_rad_s`, as her hip goes ahead of it: her hip
# let `dip_m` down from where it stood over a sole first. It is on its edge in full from `edge_rad`
# of pitch. Striding only: her soles stand 0.5 deg toes up, and held on their heels for that she
# went over them 0.7 s after a hop's landing; let 1.1 deg before an edge counts, her walk was down
# in 17 s.
heel_deg = 36.2
heel_rad_s = 6.0
dip_m = 0.006
edge_rad = 0.03
# A standing sole its stride has off folds its knee as its load leaves it, this with none on it,
# rad - its leg that much shorter for its heel's rise, her knees' row told. Asked by nothing, the leg
# stayed at its length till its toes left, 18 deg where a woman's is 30: on stilts by name. At 0.17
# stiff 0.41; at 0.35 her head nods 7 deg and she strikes 489 N; at 0.52 down at 14 s. Its heel
# alone asked up, down within 32 s.
fold_rad = 0.26
# A swinging sole's pitch is its rock's: its heel this further up behind her, its toes as much less
# up ahead.
heel_up = 0.5

# Her twist (machine.law.se2).
[gait.twist]
# Her twists' speeds: a walk, a sprint, a walk back, a sidestep, m/s; a turn, rad/s.
walk_m_s = 0.69
run_m_s = 1.40
back_m_s = 0.35
strafe_m_s = 0.50
yaw_rad_s = 0.70
# Her gym's other walks: on stairs, on ice, up a slope, the ballistic walk, m/s; round a circle, m/s
# and rad/s.
stairs_m_s = 0.50
ice_m_s = 0.35
slope_m_s = 0.55
ballistic_m_s = 0.75
circle_m_s = 0.55
circle_rad_s = 0.45
# Her walk's stopping distance: told to stand she goes on 0.81-0.93 m, under 0.02 m/s 1.7-2.0 s
# later (eight phases of her stride) - she has the one walk; her walk back's 0.05 m on, her
# sidestep's 0.11-0.15; half her walk's stop's spread.
stop_m = 0.87
back_stop_m = 0.05
side_stop_m = 0.15
stop_spread_m = 0.06
# Her walk's rhythm (gait_base.lisp's sway), and her brake's blend one stride of it, both soles
# braking her - over 0.5 s her plan stopped before a sole could, she walked on at 0.6-0.85 m/s and
# one landing took 0.85 to 0.10 m/s in 0.2 s, her trunk 13 deg ahead and her arms at 344 deg/s.
walk_hz = 0.9
# Her stand's blend (gait_base.lisp's stand): no brake shorter - braked over a stride, her turns on
# the spot fell in 41 more errands of 336, her chair's settle and turn.
stand_s = 0.5
