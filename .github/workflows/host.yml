# The offline gate, on every push: the suites that need no board, no
# ollama daemon and no bench - the same set `run_tests.py --offline` has
# always named. The C cores (Modbus, SHTP, Filter, Drive) build with the
# runner's own gcc exactly as they do with the bench's; the model-driven
# test pick degrades to the path map on a machine with no daemon, which a
# runner is. What CI cannot judge stays what it always was: parity,
# bench, conformance and the live model wait for hardware, and the
# .counts.json totals check states that a fresh clone has measured
# nothing rather than failing on it.
name: host

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write        # the failure step posts the log tail as a commit comment

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']   # the declared floor, and a current one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: host/requirements.txt
      - run: pip install -r host/requirements.txt
      - run: python tools/run_tests.py --offline 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
        shell: bash
        working-directory: host
      # A red run must be readable without the Actions UI: the tail of the
      # runner's own output lands as a commit comment, public like the repo.
      - if: failure()
        working-directory: host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 run.log > tail.log
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(printf 'CI offline (%s) failed. Log tail:\n\n~~~\n' '${{ matrix.python }}'; cat tail.log; printf '\n~~~\n')" \
            || true
