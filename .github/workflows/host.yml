# A runner probe on a temporary branch, never merged: where her motion.control's C parts from its python
# twins on each runner this matrix lands on (host/tools/dev/probe_twins.py).
name: host

on:
  push:
    branches: [probe-twins]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
        seat: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/inputs
        with:
          apt: libegl1 libgl1-mesa-dri
          requirements: host/requirements.txt
          constraints: host/constraints.txt
          editable: host
      - run: python -X utf8 tools/dev/probe_twins.py
        shell: bash
        working-directory: host
        env:
          MUJOCO_GL: egl
