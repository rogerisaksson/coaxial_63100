# Gearboxes: one stage, a wave generator pushing rollers in a cage against a lobed ring - rolling
# where a cycloid slides, many rollers sharing a blow -, backdrivable at these ratios.
#
# diameter_m: shock torque, mass and drag scale as D^3, axial length as 0.28 D, and torsional
# stiffness as 2.20e6 D^2 (`machine.body.drives`).
# input_j_share: input-side carrier inertia seen at the motor as a share of the rotor's inertia.
# zeta: structural damping ratio of the lobed ring mesh.
# backlash_deg, friction_share: mesh play at the output and mesh Coulomb loss share.

[B]
kind = "roller wave"
diameter_m = 0.064
ratio = 30.0
input_j_share = 0.05
zeta = 0.3
backlash_deg = 0.5
friction_share = 0.02

[A]
kind = "roller wave"
diameter_m = 0.084
ratio = 30.0
input_j_share = 0.05
zeta = 0.3
backlash_deg = 0.5
friction_share = 0.02

[S]
kind = "roller wave"
diameter_m = 0.050
ratio = 30.0
input_j_share = 0.05
zeta = 0.3
backlash_deg = 0.5
friction_share = 0.02
