# The gynoid mesomorph medium's performance build: her build (`extends`) with U12 II KV120 motors on box A
# (84 mm) for the spine, hips, knees and ankles; mass, inertia, structural wind-up, servo clamps/gains and
# gait laws are derived automatically (`machine.body.drives`, `machine.body.compile`).
extends = "gynoid_mesomorph_medium"

[stacks]
spine = ["U12", "A", "coaxial_63100"]
hip = ["U12", "A", "coaxial_63100"]
knee = ["U12", "A", "coaxial_63100"]
ankle = ["U12", "A", "coaxial_63100"]
