# The host stack as an installable package: `pip install -e host/`, once per clone, puts
# every package here on the path - machine, coaxial, the MCP server and model runner, the
# terminal, the tools - and hands out the console entries. Nothing sets sys.path.
#
# ONE DEPENDENCY LIST. `requirements.txt` stays the annotated authority -
# its comments say why each package is here - and `dynamic` reads it, so
# `pip install -e .` and `pip install -r requirements.txt` cannot drift.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coaxial63100"
version = "1.6.0"                    # tracks the firmware it speaks to
description = "Host stack for the coaxial 63100 BLDC inverter: library, MCP server, local-model runner"
readme = "README.md"
requires-python = ">=3.10"           # developed and gated on 3.14
dynamic = ["dependencies"]

[project.scripts]
coaxial = "coaxial.cli:main"
coaxial-dbg = "coaxial_ollama.cli:main"
coaxial-mcp = "coaxial_mcp.server:main"

[tool.setuptools.packages.find]
include = ["coaxial*", "machine*", "terminal*", "testline*", "tools*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
