# Gearboxes as bought: one stage, a wave generator pushing rollers in a cage against a lobed ring -
# rolling where a cycloid slides, many rollers sharing a blow -, backdrivable at these ratios.
# Envelope, mass, torsional stiffness, shock torque, no-load drag, carrier inertia and mesh damping
# follow from diameter, efficiency and steel mechanics (`machine.solver.drivetrain`).

[B]
diameter_m = 0.064
ratio = 30.0
efficiency = 0.90
backlash_deg = 0.5
l10_cycles = 2.0e6

[A]
extends = "B"
diameter_m = 0.084

[S]
extends = "B"
diameter_m = 0.050

# B with 45 lobes: the ankle's two small drives sharing its pitch, each to its peaks as measured at main
# (tools/sim/legload.py --joint ankle: a drive's 74 N m on a hop up, 68 on a running jump, 14.7 rad/s).
[B45]
extends = "B"
ratio = 45.0
