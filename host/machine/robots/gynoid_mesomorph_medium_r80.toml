# The gynoid mesomorph medium's mechatronics on CubeMars' motors: her build (`extends`) with the R80
# where it has the U8 II (the same 36N42P class, 4.0 N m, 100 g more each) and the R60 where the
# MN6007 (2.4 N m for 1.9) (`swap`), box B and the 63100 on every drive as hers; her figure, her
# servos, her structure and her text (machine/gynoid_mesomorph_medium_r80.lisp extends hers).
# COAXIAL_ROBOT names it (machine.mechatronics); host/tools/cores/manifest.py writes its manifest.
extends = "gynoid_mesomorph_medium"

[swap]
U8 = "R80"
MN6007 = "R60"
