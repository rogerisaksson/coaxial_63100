<rect width="1280" height="685" rx="10" fill="#020617"/>
<g font-family="monospace">
<text x="24" y="34" fill="#f8fafc" font-size="16" font-weight="bold">COAXIAL 63100 -- Software Systems Engineering &amp; Real-Time Control Architecture</text>
<text x="24" y="54" fill="#94a3b8" font-size="11">5-Layer Data-Oriented Pipeline: Outer Setpoint UI (60 Hz) &lt;-&gt; Sensing &amp; Outward Situation (333 Hz) &lt;-&gt; Branchless SE(3)/Modal Continuum (333 Hz) &lt;-&gt; Inner ESO &amp; SIL (1 kHz)</text>
<rect x="20" y="150" width="205" height="295" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
<text x="32" y="176" fill="#38bdf8" font-size="12" font-weight="bold">RUNTIME ORCHESTRATOR</text>
<text x="32" y="194" fill="#e2e8f0" font-size="10">machine.worker / apart</text>
<text x="32" y="210" fill="#94a3b8" font-size="10">sprung.laid + motion.laid</text>
<line x1="32" y1="222" x2="213" y2="222" stroke="#334155" stroke-width="1"/>
<text x="32" y="240" fill="#f8fafc" font-size="10" font-weight="bold">Shared State Arrays:</text>
<text x="32" y="258" fill="#38bdf8" font-size="9">cmd / states  IPC (60 Hz)</text>
<text x="32" y="276" fill="#a78bfa" font-size="9">y_in[261]     edge.SENSED</text>
<text x="32" y="294" fill="#a78bfa" font-size="9">y[74], fr[100] modal.SENSED</text>
<text x="32" y="312" fill="#34d399" font-size="9">st[369], tab  latent.STATE</text>
<text x="32" y="330" fill="#34d399" font-size="9">out[107]       latent.OUT</text>
<text x="32" y="348" fill="#fbbf24" font-size="9">a[74]         modal.ASK</text>
<text x="32" y="366" fill="#fbbf24" font-size="9">got[qacc,tau] wrench.solve</text>
<text x="32" y="384" fill="#f472b6" font-size="9">eso[3,21]     1 kHz observer</text>
<text x="32" y="402" fill="#f472b6" font-size="9">5x RS485 RTU  10 Mbit/s SIL</text>
<text x="32" y="424" fill="#94a3b8" font-size="9">0 branches in inner core</text>
</g>
