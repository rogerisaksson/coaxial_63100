# Every source of every pinned tool fetched, checked and unpacked - the mirrors a job falls back to
# among them (.github/inputs.sh --every) - when the table or its fetcher changes, weekly, and when
# asked: a fallback no run exercises would rot unseen, the Actions cache answering in its place.
name: inputs

on:
  push:
    branches: [main]
    paths: ['.github/inputs.txt', '.github/inputs.sh', '.github/workflows/inputs.yml']
  pull_request:
    paths: ['.github/inputs.txt', '.github/inputs.sh', '.github/workflows/inputs.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/inputs.sh --every
