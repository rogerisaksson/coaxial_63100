<text x="673" y="513" fill="#94a3b8" font-size="9">collective + cyclic swash</text>
<text x="673" y="527" fill="#cbd5e1" font-size="9">tail anti-torque + piro</text>
<text x="673" y="540" fill="#fbbf24" font-size="9">out: coll, cyc_p, cyc_r, tail</text>
<line x1="957" y1="472" x2="957" y2="484" stroke="#fbbf24" stroke-width="1.8"/>
<rect x="865" y="484" width="184" height="62" rx="5" fill="#1e293b" stroke="#fbbf24" stroke-width="1.3"/>
<text x="873" y="498" fill="#f8fafc" font-size="10" font-weight="bold">#4 ornithopter/law.py</text>
<text x="873" y="513" fill="#94a3b8" font-size="9">stroke + pitch + roll_d</text>
<text x="873" y="527" fill="#cbd5e1" font-size="9">dive wing fold &amp; soar</text>
<text x="873" y="540" fill="#fbbf24" font-size="9">out: 4x flapping controls</text>
<line x1="1157" y1="472" x2="1157" y2="484" stroke="#fbbf24" stroke-width="1.8"/>
<rect x="1065" y="484" width="184" height="62" rx="5" fill="#1e293b" stroke="#fbbf24" stroke-width="1.3"/>
<text x="1073" y="498" fill="#f8fafc" font-size="10" font-weight="bold">#5 aerobat/law.py</text>
<text x="1073" y="513" fill="#94a3b8" font-size="9">propeller + slipstream tail</text>
<text x="1073" y="527" fill="#cbd5e1" font-size="9">knife-edge, harrier, flare</text>
<text x="1073" y="540" fill="#fbbf24" font-size="9">out: pitch, elev, ail, rud</text>
</g>
<g font-family="monospace">
