# The gynoid mesomorph medium's physical, electromechanical and electronic construction:
# her battery packs, each joint kind's stack of parts from the library (machine/library), her ankle's
# carbon leaf spring, joints without a drive, clothing over her drives, carbon-epoxy shells, internal
# payloads, limb quick-releases and anthropometric figure. All servo gains, structural wind-up, leaf
# stiffness, standing/deep-squat equilibria, service bands and Froude-scaled gait laws are derived by
# the static meta-compiler (`structural`, `drives`, `figure`, `compile`).

# Her two packs in parallel, each 15S2P of 5 Ah 21700 cells (`build.HOLDS`, `dclink`): cell cutoff
# voltage (V), cell and case/BMS mass (kg), cell DC resistance (ohm), BMS max charge per cell (A),
# per-board DC link capacitance (F: 33 x 10 uF X7S 1210), and flank mount coordinates in the torso (m).
[pack]
packs = 2
series = 15
parallel = 2
cell_v_min = 3.2
cell_kg = 0.068
case_kg = 0.36
cell_ohm = 0.020
cell_charge_a = 4.9
board_link_f = 330e-6
mounts = [[0.065, 0.17, -0.005], [-0.065, 0.17, -0.005]]

# Each kind's stack: [motor, gearbox, inverter] (`docs/findings/stacks.md`).
[stacks]
spine = ["U8", "B", "coaxial_63100"]
spine_roll = ["U8", "B", "coaxial_63100"]
waist = ["U8", "B", "coaxial_63100"]
hip_yaw = ["U8", "B", "coaxial_63100"]
hip_roll = ["U8", "B", "coaxial_63100"]
hip = ["U8", "B", "coaxial_63100"]
knee = ["U8", "B", "coaxial_63100"]
ankle = ["U8", "B", "coaxial_63100"]
ankle_roll = ["U8", "B", "coaxial_63100"]
neck = ["MN6007", "B", "coaxial_63100"]
head = ["MN6007", "B", "coaxial_63100"]
shoulder = ["MN6007", "B", "coaxial_63100"]
elbow = ["MN6007", "B", "coaxial_63100"]
wrist = ["MN6007", "B", "coaxial_63100"]
gripper = ["MN6007", "B", "coaxial_63100"]
foot = ["MN6007", "B", "coaxial_63100"]

# Pre-curved unidirectional carbon leaf spring standing in for the ankle pitch rod (`structural.leaf_series`):
# rectangular laminate width and 50-ply cured thickness, m; arc length and crown follow `linkage.RODS`/`BENDS`.
[leaf]
joint = "ankle"
width_m = 0.03673
thick_m = 0.00625

# Joints without a drive: way 1 on a passive spring, way 2 held between stops (`mjcf.HELD_DEG`).
[passive]
foot = { way = 1.0 }
gripper = { way = 2.0, stiffness = 40.0, damping = 1.0, rest = 80.0 }
wrist = { way = 2.0 }

# Forefoot TPU-carbon sandwich toe spring (`drives.passive`, `docs/findings/feet.md`).
[toes]
stiffness = 10.0
loss = 0.3
rest = 0.0

# Clothing thermal insulation over bare-air convection (ISO 9920): 1.0 bare, 1.20 cotton tee, 1.45 denim.
[cloth]
hip_yaw = 1.45
hip_roll = 1.45
hip = 1.45
knee = 1.45
ankle = 1.45
ankle_roll = 1.45
spine = 1.20
spine_roll = 1.20
waist = 1.20
shoulder = 1.20
elbow = 1.20
neck = 1.0
head = 1.0
wrist = 1.0
gripper = 1.0
foot = 1.0

# Real-time RS485 fieldbus electronics: bus rate (Hz), whole-body law decimation, wire bit rate,
# board poll turnaround (s), board thermal step (s) and noisy-run bit error rate (`body.compile`).
[bus]
bus_hz = 1000.0
law_div = 3
baud = 10_000_000
turn_s = 30e-6
thermal_s = 0.01
spin_s = 0.002
stall_s = 60.0
threads_a_limb = 2
line_ber = 1e-7

# Stereo cameras and coupled pushrod eye gimbals (`machine.eyes.stereo`, `machine.eyes.gimbal`).
[eyes]
resolution = [640, 480]
fovy_deg = 60.0
baseline_m = 0.12
left_at = [0.05, 0.10, 0.09]
down_deg = 15.0
squint_deg = { left = [-0.35, -0.40, 0.20], right = [0.30, 0.50, -0.25] }
rods = { left = [1.0, 1.0], right = [1.012, 0.994] }
play_deg = { left = [0.20, 0.15], right = [0.35, 0.25] }
lever_m = { left = 0.006, right = 0.0065 }
church = { left = -0.025, right = 0.025 }
census_px = [9, 7]
window_px = 9
quantum = 1
p1 = 20
p2 = 240
texture = 1.5
unique = 1.15

# Passive-spring armature inertia (kg m^2) and held-joint mechanical stop half-width (deg).
[passive_limits]
armature_kgm2 = 0.0005
held_deg = 0.5

# Carbon-epoxy shells over her capsules (`machine/body/build.py`), housing lips/brackets and thermal interfaces.
[shell]
wall_m = 0.002
kg_m3 = 1600.0
tim_m = 0.5e-3
tim_w_m_k = 0.32
cf_thru_w_m_k = 0.48
lip_m = 0.002
fastener_share = 1.1
plate_w_m = 0.050
crown_w_m = 0.040
wall_share = 0.10
flex_at = 0.6
flex_deg = 0.25
margin = 1.5
room_m = 0.0025

# Mechanical bracket and shell hard-stops, [low, high] deg; linkage strokes follow `[linkage]`.
[stops]
elbow = [-5.0, 160.0]
knee = [-5.0, 165.0]
spine = [-30.0, 85.0]
waist = [-50.0, 50.0]
hip_yaw = [-25.0, 25.0]
neck = [-45.0, 60.0]
head = [-80.0, 80.0]

# Remote split inverter bays (`drives.BOARDS`): `stack_on` stacks a twin disc outboard by `height_m + gap_m`.
[boards]
knee = { on = "thigh", at = [0.035, -0.18, 0.01], face = "x" }
ankle = { stack_on = "knee", gap_m = 0.001 }
spine = { on = "torso", at = [0.0, 0.14, -0.066], face = "z" }
neck = { on = "torso", at = [0.0, 0.245, -0.066], face = "z" }
head = { stack_on = "neck", gap_m = 0.002 }

# Drive assembly mounts (`drives.JOINTS`): omitted joints sit coaxially at (0, 0, 0) on their axis or stage;
# `along_m` shifts coaxially from the segment pivot, `z_m` places a planar-crank drum, and `x_m`/`dy_m` place
# rod-crank drums relative to their `[linkage.rods]` hub on `shank`.
[mounts]
spine_roll = { on = "pelvis", z_m = 0.005 }
waist = { on = "torso", along_m = 0.12, face = "-y" }
shoulder = { on = "torso", along_m = -0.015 }
elbow = { on = "upper_arm", along_m = 0.0, face = "-x" }
wrist = { on = "forearm", at = [0.0, -0.12, 0.0], face = "-y" }
gripper = { on = "forearm", at = [0.0, -0.165, 0.0] }
hip_yaw = { on = "pelvis", along_m = 0.103, face = "-y" }
hip_roll = { on = "hip_yaw", at = [-0.025, 0.035, -0.078] }
ankle = { on = "shank", x_m = 0.002, dy_m = -0.010, face = "x" }
ankle_roll = { on = "shank", x_m = -0.004, dy_m = 0.0, face = "-x" }
foot = { on = "foot", at = [0.0, -0.04, 0.045] }

# Off-axis mechanical transmissions (`machine/body/linkage.py`): parallel ankle rods, four-bars, spurs, belts.
[linkage]
rod_r = 0.006
plate_r = 0.004
bevel_t = 0.006
bevel_eff = 0.97
pairs = { ankle = "ankle_roll" }
rolled = { ankle = 15.0 }
gears = { hip_roll = 1.67 }
belts = { foot = [0.010, 0.010, 0.036] }

[linkage.rods]
ankle = { joint = "ankle", up = 0.300, ahead = 0.015, crank_m = 0.020, crank_deg = 90.0, ball_m = 0.018, ball_deg = 255.0, crank_x = 0.045, ball_x = 0.012, bend = [0.045, 0.180, 0.0139], stroke = [-50.0, 45.0] }
ankle_roll = { joint = "ankle", up = 0.230, ahead = 0.000, crank_m = 0.024, crank_deg = 90.0, ball_m = 0.022, ball_deg = 255.0, crank_x = -0.047, ball_x = -0.016, bend = [-0.047, 0.205, 0.0193], stroke = [-50.0, 45.0] }

[linkage.planar]
