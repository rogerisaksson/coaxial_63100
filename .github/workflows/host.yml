# The offline gate, on every push: the suites that need no board, no ollama
# daemon and no bench - the same set `run_tests.py --offline` has always named.
name: host

on:
  push:
    branches: [main]
  pull_request:
  # Asked by hand with measure: every suite to its end on the runner - none cut at a limit, none
  # stopping the run (run_tests.py --measure) -, the run's log the runner's measure of each suite's
  # work, laid in tests/work.json by `machine_detector.py --keep --tail`.
  workflow_dispatch:
    inputs:
      measure:
        description: every suite to its end, none cut - the runner's measure
        type: boolean
        default: false

permissions:
  contents: write        # the failure step posts the log tail as a commit comment

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ['3.12', '3.14']   # the declared floor, and the one it is developed on
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # What the suites take from outside, kept in the Actions cache (.github/actions/inputs): their
      # environment, and Mesa's EGL in software for her eyes' renderer (machine.eyes.sight, MuJoCo's) -
      # the runner has no display; without it mjr_makeContext raised and test_sight crashed. Fetched
      # afresh every run, apt's mirrors not resolving failed the gate before a suite ran (f97eab6b,
      # c3a6174a, 074c24b0).
      - uses: ./.github/actions/inputs
        with:
          apt: libegl1 libgl1-mesa-dri
          requirements: host/requirements.txt
          constraints: host/constraints.txt     # one version a distribution, as on the desk and in the Linux containers
          editable: host
      # numpy's AVX2 paths on every runner, as on the desk and the EPYC 7763: on AVX-512 (Xeon 8370C/8573C,
      # EPYC 9V45/9V74) numpy sent tan, asin, acos, atan2, exp and log to SVML, a last bit apart from the libm
      # her C calls, and her wrench magnified it past her twins' bounds (5.33e-05 N m of tau at test_tick's pass
      # 2298); OpenBLAS's kernel her C takes as numpy does (wbc_dot, wbc_matmul) - forced, it crashed Zen 4/5
      - run: python tools/dev/run_tests.py --offline ${{ inputs.measure && '--measure' || '' }} 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
        shell: bash
        working-directory: host
        env:
          MUJOCO_GL: egl
          NPY_DISABLE_CPU_FEATURES: X86_V4 AVX512_ICL AVX512_SPR
      # A red run must be readable without the Actions UI: the tail of the
      # runner's own output lands as a commit comment, public like the repo.
      - if: failure()
        working-directory: host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 run.log > tail.log 2>/dev/null || echo "no gate ran: a step before it failed" > tail.log
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(printf 'CI offline (%s) failed. Log tail:\n\n~~~\n' '${{ matrix.python }}'; cat tail.log; printf '\n~~~\n')" \
            || true
