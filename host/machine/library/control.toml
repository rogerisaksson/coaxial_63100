# The control design's targets (`mechatronics.control()`): what a loop is asked to be, stated once for
# every machine. The robot's joints and a craft's axes are solved between what their task needs and what
# their machine allows (`machine.solver.loops`) by the same numbers; a target is a requirement of the
# design, no share fitted to a table, and the comparison of today's tables with the solved loops starts
# from these.

# A loop's damping ratio, on the most inertia its drive sees.
damping_ratio = 0.7
# The phase a loop's dead time and its actuator's lags may take at its crossover, deg: what a loop's delays
# may take and still leave it forty degrees - the robot's ankle on its free foot takes 22.
delay_phase_deg = 25.0
# A loop's natural frequency over the fastest motion asked of it, at the least: the heavy ornithopter's
# tilt stands 1.72 over its wings' beat.
motion_factor = 1.7
# The error at which a loop may ask all its drive has, at the least, deg: the authority's ceiling. A
# craft's tilt stands at it - the quad's, the helicopter's and the ornithopter's blocks each ask all
# their drive at 21.
excursion_deg = 21.0
# A stance loop's natural frequency over the rate its machine falls at: at three the robot's ankle would
# need more stiffness than the leaf in series with it has.
fall_factor = 2.0
# An inner loop's natural frequency over the outer loop's it serves: a limb's over the stance loop's, a
# tilt's over the loop along the floor.
cascade_factor = 4.5
# An observer's bandwidth over the loop it serves.
observer_factor = 10.0
