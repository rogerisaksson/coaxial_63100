<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System atlas</title>
<style>
/* The stack is neutral - its place and its numbers tell a layer -; colour is the focus alone: the node
   open, what it reaches, what reaches it (all-pairs CVD-safe, validated), a word found (alone). */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2329; --mute: #5a6470; --line: #d7dce2; --accent: #0b62d6;
  --open: #2a78d6; --out: #1baf7a; --in: #eb6834; --hit: #e87ba4;
  --slab: #e3e6ea; --tile-a: #c9ced5; --tile-b: #b9bfc8; --edge: #a3aab4;
  --slab-beside: #eceef1; --tile-beside-a: #dadee3; --tile-beside-b: #d0d5db;
  --heat-1: #b7d3f6; --heat-2: #86b6ef; --heat-3: #5598e7; --heat-4: #256abf; --heat-5: #104281;
  --heat-ink-1: #1d2329; --heat-ink-2: #1d2329; --heat-ink-3: #1d2329; --heat-ink-4: #fff; --heat-ink-5: #fff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --panel: #161b22; --ink: #e5eaf0; --mute: #8e98a3; --line: #2d343d; --accent: #5aa2ff;
    --open: #3987e5; --out: #199e70; --in: #d95926; --hit: #d55181;
    --slab: #262c34; --tile-a: #3a424d; --tile-b: #444d59; --edge: #15191e;
    --slab-beside: #1e232a; --tile-beside-a: #2c333c; --tile-beside-b: #333b45;
    --heat-1: #184f95; --heat-2: #1c5cab; --heat-3: #2a78d6; --heat-4: #6da7ec; --heat-5: #b7d3f6;
    --heat-ink-1: #fff; --heat-ink-2: #fff; --heat-ink-3: #fff; --heat-ink-4: #0e1116; --heat-ink-5: #0e1116;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
h1, .t, .who, .s, #crumbs, .heat th { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
header { position: sticky; top: 0; z-index: 200; display: flex; gap: 14px; align-items: center;
  padding: 9px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
#crumbs { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12.5px; }
#crumbs a { color: var(--accent); cursor: pointer; }
#crumbs a:hover { text-decoration: underline; }
#crumbs .sep { margin: 0 5px; }
#find { width: 230px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); font: inherit; }
#find:focus, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
main { display: grid; grid-template-columns: 384px minmax(0, 1fr); align-items: start; }
#tower { position: sticky; top: 51px; max-height: calc(100vh - 51px); overflow: auto;
  padding: 26px 8px 22px 0; border-right: 1px solid var(--line); }
.inside { position: relative; }
#wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; overflow: visible; }
#wires path { fill: none; stroke-linecap: round; opacity: .9; }
.row { position: relative; display: grid; grid-template-columns: 220px minmax(0, 1fr); align-items: center;
  height: 60px; cursor: pointer; }
.slab { width: 132px; height: 78px; margin-left: 58px; display: flex; flex-wrap: wrap; align-content: stretch;
  gap: 2px; padding: 4px; border-radius: 5px; --iso: rotateX(60deg) rotateZ(-45deg); transform: var(--iso);
  filter: drop-shadow(0 7px 7px rgb(0 0 0 / .22)); background: var(--slab);
  box-shadow: 0 0 0 1px rgb(127 127 127 / .25), 5px 5px 0 var(--edge); transition: .2s ease; }
.row:hover .slab { transform: var(--iso) translateZ(6px); }
.row.on .slab { transform: var(--iso) translateZ(12px); box-shadow: 0 0 0 2px var(--open), 5px 5px 0 var(--edge); }
.row.dim .slab { opacity: .3; }
.row.beside .slab { --slab: var(--slab-beside); --tile-a: var(--tile-beside-a); --tile-b: var(--tile-beside-b); }
.tile { flex: var(--n) 1 9px; min-height: 9px; border-radius: 2px; background-color: var(--tile-a);
  background-image: linear-gradient(160deg, rgb(255 255 255 / .22), rgb(255 255 255 / 0) 55%); transition: background-color .2s ease; }
.tile:nth-child(even) { background-color: var(--tile-b); }
.tile:hover { outline: 2px solid var(--ink); }
.tile.on { background-color: var(--open); }
.tile.out { background-color: var(--out); }
.tile.in { background-color: var(--in); }
.tile.hit { background-color: var(--hit); }
.tag { display: flex; flex-direction: column; min-width: 0; }
.tag b { font-size: 13px; }
.tag small, .tag i, .tag em { font-size: 11.5px; font-style: normal; }
.tag em { display: none; }
.root .tag em { display: block; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 6px; vertical-align: -1px; background: var(--c); }
.sw:first-child { margin-left: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 22px 0 6px 18px; font-size: 11.5px; }
#tower h4 { margin: 18px 0 2px 18px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
#lens { padding: 20px 24px 48px; min-width: 0; }
.head { border-left: 4px solid var(--open); padding-left: 12px; }
.kind { display: inline-block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-right: 8px; }
.where, .stats, .sym .b, .none, .ties h3, .hit .b, .card .b { font-size: 12.5px; }
.tag small, .tag em, .legend, #tower h4, .where, .brief, .stats, .card .n, .card .b, .card .r, .sym .b,
.tie .k, .tie .c, .hit .b, .none, footer, .ties h3, .kind, h2 small, h3 small, #crumbs .sep, #head,
.heat caption, .scale { color: var(--mute); }
h1 { font-size: 19px; margin: 6px 0 4px; word-break: break-word; }
h2 { font-size: 14px; margin: 28px 0 10px; }
h2 small, h3 small { font-weight: 400; }
.brief { margin: 0 0 6px; max-width: 86ch; }
.stats { margin: 0; }
a.code, a.ln { color: var(--accent); text-decoration: none; }
a.code:hover, a.ln:hover { text-decoration: underline; }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 16px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.card { display: flex; flex-direction: column; gap: 3px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px; animation: rise .18s ease both; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card .top { display: flex; gap: 8px; align-items: baseline; }
.card .t { font-size: 13px; font-weight: 600; word-break: break-all; flex: 1; }
.card .n, .card .r, .tie .c { font-size: 11.5px; white-space: nowrap; }
.card .b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#lens[data-way="up"] .card { animation-name: fall; }
@keyframes rise { from { opacity: 0; transform: translateY(5px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes fall { from { opacity: 0; transform: translateY(-5px) scale(1.015); } to { opacity: 1; transform: none; } }
.syms { margin-top: 16px; border-top: 1px solid var(--line); }
.sym { display: grid; grid-template-columns: 58px minmax(0, 1fr); column-gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.sym .ln { font: 12px ui-monospace, monospace; padding-top: 1px; }
.sym .s { font-size: 12.5px; word-break: break-word; }
.sym .s:hover { color: var(--accent); }
.sym .b { grid-column: 2; }
.ties { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 26px; }
.ties h3 { margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
.tie, .hit { display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 4px 6px; border-radius: 5px; }
.tie:hover, .hit:hover, .tie:focus-visible, .hit:focus-visible, .sym .s:focus-visible { background: var(--panel); outline: 2px solid var(--accent); outline-offset: -2px; }
.tie .who, .hit .who { flex: 1; font-size: 12.5px; word-break: break-all; }
.tie .k { font-size: 11px; }
.tie .c { min-width: 2.5em; text-align: right; }
.hit .b { flex: 1.4; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
mark { background: color-mix(in srgb, var(--hit) 30%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
.matrix { overflow-x: auto; }
.heat { border-collapse: separate; border-spacing: 2px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.heat caption { text-align: left; caption-side: bottom; padding-top: 8px; font-size: 11.5px; }
.heat th { font-weight: 600; font-size: 11px; white-space: nowrap; padding: 2px 6px; text-align: right; }
.heat thead th { vertical-align: bottom; padding: 0 0 4px; }
.heat thead th span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; }
.heat td { min-width: 34px; height: 26px; text-align: center; border-radius: 3px; padding: 0 4px; cursor: pointer; }
.heat td:hover, .heat td:focus-visible { outline: 2px solid var(--ink); outline-offset: -1px; }
.heat td.self { box-shadow: inset 0 0 0 1px var(--mute); }
.heat td.b0 { color: var(--mute); cursor: default; }
.b1 { background: var(--heat-1); color: var(--heat-ink-1); } .b2 { background: var(--heat-2); color: var(--heat-ink-2); }
.b3 { background: var(--heat-3); color: var(--heat-ink-3); } .b4 { background: var(--heat-4); color: var(--heat-ink-4); }
.b5 { background: var(--heat-5); color: var(--heat-ink-5); }
.scale { display: flex; gap: 2px; align-items: center; margin-top: 8px; font-size: 11.5px; }
.scale span { padding: 1px 7px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.scale b { font-weight: 400; margin-right: 6px; }
footer { font-size: 11.5px; margin-top: 34px; }
@media (prefers-reduced-motion: reduce) { .card, .slab { animation: none; transition: none; } }
@media (max-width: 780px) {
  header { flex-wrap: wrap; }
  #find { width: 100%; order: 3; }
  #crumbs { order: 4; flex-basis: 100%; }
  main { grid-template-columns: minmax(0, 1fr); }
  #tower { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  #lens { padding: 16px; }
  .ties, .grid, .grid.wide { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<header>
  <span class="brand">atlas</span><span id="head"></span>
  <nav id="crumbs" aria-label="Where"></nav>
  <input id="find" type="search" placeholder="Find  ( / )" autocomplete="off" spellcheck="false" aria-label="Find">
</header>
<main>
  <section id="tower" aria-label="The trunk"></section>
  <section id="lens" aria-live="polite"><noscript>The atlas is drawn by its script.</noscript></section>
</main>
<script id="atlas-data" type="application/json">"__ATLAS__"</script>
<script>/*__SCRIPT__*/</script>
</body>
</html>
