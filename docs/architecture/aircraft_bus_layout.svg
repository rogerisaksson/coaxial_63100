<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 665" width="100%" height="100%">
<rect width="1220" height="665" rx="10" fill="#020617"/>
<g font-family="monospace">
<text x="24" y="34" fill="#f8fafc" font-size="16" font-weight="bold">COAXIAL 63100 -- 10 Mbit/s RS485 Modbus RTU Aircraft Drive, Servo &amp; Avionics Buses (4 Airframes, 10 SIL Drives)</text>
<text x="24" y="54" fill="#94a3b8" font-size="11">Generated from machine.senses (GNSS=20 Hz, STAR=5 Hz), machine.pull (I_MAX=60 A), flightpack (15S 63 V), and craft airframes</text>
<rect x="20" y="160" width="200" height="245" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
<text x="32" y="186" fill="#38bdf8" font-size="12" font-weight="bold">FLIGHT LAW &amp; MASTER</text>
<text x="32" y="204" fill="#e2e8f0" font-size="10">aero/ + SO(3) craft laws</text>
<text x="32" y="220" fill="#94a3b8" font-size="10">CoaxialDrives (240-500 Hz)</text>
<line x1="32" y1="232" x2="208" y2="232" stroke="#334155" stroke-width="1"/>
<text x="32" y="250" fill="#f8fafc" font-size="10" font-weight="bold">Modbus &amp; Wire Banks:</text>
<text x="32" y="268" fill="#cbd5e1" font-size="10">SETPOINT 0x0100</text>
<text x="32" y="286" fill="#cbd5e1" font-size="10">KP       0x0140</text>
<text x="32" y="304" fill="#cbd5e1" font-size="10">FEED     0x0180</text>
<text x="32" y="322" fill="#cbd5e1" font-size="10">LIMIT    0x01c0</text>
<text x="32" y="340" fill="#cbd5e1" font-size="10">STATE    0x0200</text>
<text x="32" y="358" fill="#cbd5e1" font-size="10">AERO_OP  0x000e</text>
</g>
