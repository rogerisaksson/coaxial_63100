# The gynoid mesomorph medium's mechatronics on CubeMars motors: her build (`extends`) with R80 where she has
# U8 II and R60 where MN6007 (`swap`), box B and coaxial_63100 on every drive; mass, rotor inertia, servo gains
# and gait laws are derived automatically (`machine.body.drives`, `machine.body.compile`).
extends = "gynoid_mesomorph_medium"

[swap]
U8 = "R80"
MN6007 = "R60"
