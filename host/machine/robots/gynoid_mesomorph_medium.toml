# The gynoid mesomorph medium's mechatronics: her pack, each joint kind's stack of parts from the
# library (machine/library), the servos her boards run, the structure between a gearbox and its
# limb, the joints without a drive, her clothes over her drives. host/tools/cores/manifest.py
# writes her orthokinematic manifest of it (machine/gynoid_mesomorph_medium.manifest.lisp).

# The supply's lowest, V: 48-63, the boards' top 63.
pack_v = 48.0
# Each winding's and laminate's K/W to the air times this - 1 in air. Her joints air-cooled, a
# board's back on an aluminium holder over a third of it, on its motor or gearbox, its only
# cooling (0.3 in oil).
cooling = 1.0
# Whether a joint's clamp is its drive's peak where that is less (`drives.peak`), 0 or 1.
clamped = 1.0
# Rigid (`physics.BOXED` 0) the boards' encoders see the joint held within this, deg, a wave
# drive's few arcmin, as her walk's band was measured.
rigid_play_deg = 0.1
# The wind-up and the play a board asks its rotor ahead of its setpoint by
# (`gearbox.Boxes.ahead`): both, her toes dragged 16 mm at lift for 19, the walk 730 J/m for 607;
# the wind-up's alone 8-14 mm at 0.1-0.3 deg of play.
ahead_wind = 0.0
ahead_play = 0.0
# A board's thermal resistance to its stator, K/W: on its axis, and split off-axis on a limb's
# shell (`drives.BOARDS`).
mount_k_w = 0.60
off_mount_k_w = 2.20

# Each kind's stack: [motor, gearbox, inverter]. The U8 where a joint asks over 50 N m - the
# legs, the trunk -, the MN6007 for the arms and the head: 15 and 6 of her 21; her 30.8 kg where
# 28.4, a hip's rotor 0.177 kg m^2 at its joint where 0.071. What they replaced and why each
# stood: docs/findings/stacks.md.

# Her two packs, in parallel, each 15S2P of 5 Ah 21700 cells (`build.HOLDS`): each cell's DC
# resistance, ohm, and the most its BMS charges it with, A - the cell's datasheet class,
# estimated; each board's DC link, F: the 63100's 33 x 10 uF X7S 1210 (its BOM), nominal.
[pack]
packs = 2
series = 15
parallel = 2
cell_ohm = 0.020
cell_charge_a = 4.9
board_link_f = 330e-6

[stacks]
spine = ["U8", "B", "coaxial_63100"]
spine_roll = ["U8", "B", "coaxial_63100"]
waist = ["U8", "B", "coaxial_63100"]
hip_yaw = ["U8", "B", "coaxial_63100"]
hip_roll = ["U8", "B", "coaxial_63100"]
hip = ["U8", "B", "coaxial_63100"]
knee = ["U8", "B", "coaxial_63100"]
ankle = ["U8", "B", "coaxial_63100"]
ankle_roll = ["U8", "B", "coaxial_63100"]
neck = ["MN6007", "B", "coaxial_63100"]
head = ["MN6007", "B", "coaxial_63100"]
shoulder = ["MN6007", "B", "coaxial_63100"]
elbow = ["MN6007", "B", "coaxial_63100"]
wrist = ["MN6007", "B", "coaxial_63100"]
gripper = ["MN6007", "B", "coaxial_63100"]
foot = ["MN6007", "B", "coaxial_63100"]

# A drive by its joint's kind: [peak N m, kp N m/rad, kd N m s/rad, armature kg m^2]. The ankles
# stiffer than the body leaning on them (m g h, 490 N m/rad). The neck under a 3.3 kg head
# 0.18 m up (0.13 kg m^2), damped at half critical: at 60 N m/rad it nodded 6.1 degrees a step
# to her surge; 150, 300, 600: 3.0, 2.2, 1.7. The peaks her controller's own, at the drives'
# clamps before the stacks: her stacks grew to 1.5x them.
[servo]
spine = [142.5, 800.0, 30.0, 0.05]
spine_roll = [77.4, 800.0, 30.0, 0.05]
waist = [77.4, 400.0, 20.0, 0.02]
neck = [15.0, 300.0, 6.0, 0.02]
head = [8.0, 30.0, 1.0, 0.02]
shoulder = [40.0, 150.0, 6.0, 0.02]
elbow = [25.0, 80.0, 3.0, 0.02]
wrist = [11.3, 150.0, 5.0, 0.02]
gripper = [10.0, 40.0, 1.0, 0.02]
hip_yaw = [51.6, 300.0, 10.0, 0.05]
hip_roll = [128.9, 900.0, 40.0, 0.05]
hip = [171.0, 900.0, 40.0, 0.05]
knee = [171.0, 900.0, 35.0, 0.05]
ankle = [140.0, 1500.0, 40.0, 0.05]
ankle_roll = [100.0, 1500.0, 40.0, 0.05]
foot = [11.6, 40.0, 1.0, 0.02]

# Each joint's structure between its gearbox and its limb wound up a N m, mrad, its members in
# series (`tools/sim/members.py`: the pitch's bracket at 12 mm gave the spine 3.3, 27 deg at its
# clamp; sized, 0.085). With the box's own a board sees its joint wound by its last torque
# (`drives.flex`, `physics.WOUND`).
[wind]
spine = 0.085
spine_roll = 0.148
waist = 0.035
neck = 0.239
head = 0.239
shoulder = 0.122
elbow = 0.128
wrist = 0.173
gripper = 0.173
hip_yaw = 0.116
hip_roll = 0.085
hip = 0.061
knee = 0.051
ankle = 0.218
ankle_roll = 0.032
foot = 0.155

# Joints without a drive, a kind's way: on a spring, 1 - its stiffness N m/rad and damping
# N m s/rad about its rest, deg, a kind not given 40, 1 and 0 -; held at it, 2, between stops
# (`mjcf.HELD_DEG`). Any kind, for the fewest drives; the toes and the fingers to begin with: on
# the scoreboard, their four drives' 0.88 kg gone, the fingers held open at 20 deg 212 -> 349,
# held 79.5 -> 68.0 %, every rise down at 7.1 s; held a fist, 238 and 81.0 %; the toes sprung,
# 622 and 11.4 %, every walk down within 0.8 s - the walker's push-off asks them and its legs'
# reach counts on them. Each of the rest held in turn against 730 and 74.1 %: the wrists 602 and
# 74.2, every rise and walk standing - held; the head's turn 699 and 69.4 (a walk fell), the
# neck 628 and 71.2 (a rise), the waist 727 and 71.6 (a rise), the spine's roll 1293 and 23.0,
# the hips' yaw 1337 and 12.1.
[passive]
foot = { way = 1.0 }
gripper = { way = 2.0, stiffness = 40.0, damping = 1.0, rest = 80.0 }
wrist = { way = 2.0 }

# The toes' spring about flat, N m/rad, and its damping: a sneaker's forefoot, 0.2-0.5 N m a
# degree (a plated one's past 200 stood her on her toe tips) - a thin carbon-fibre sandwich with
# a TPU core, or TPU printed round carbon rods glued in with silicone: springy but damped, the
# TPU's loss factor `loss` at the push-off's `rad_s`, c = loss k / omega (`drives.passive`). The
# motors off them. `rest` deg its rest, toes up under 0 - a sneaker's toe spring
# (docs/findings/feet.md).
[toes]
stiffness = 10.0
loss = 0.3
rad_s = 20.0
rest = 0.0

# Clothing thermal insulation over bare-air convection (ISO 9920): 1.0 bare, 1.20 under a cotton
# T-shirt (0.15 clo, torso and arms), 1.45 under denim jeans (0.38 clo, pelvis and legs).
[cloth]
hip_yaw = 1.45
hip_roll = 1.45
hip = 1.45
knee = 1.45
ankle = 1.45
ankle_roll = 1.45
spine = 1.20
spine_roll = 1.20
waist = 1.20
shoulder = 1.20
elbow = 1.20
neck = 1.0
head = 1.0
wrist = 1.0
gripper = 1.0
foot = 1.0

# Service (`machine.wear`): a drift from the build past these raises an alarm - a drive's
# Coulomb friction up this share of its own and at least this, N m; its viscous friction, N m
# s/rad; its torque an amp down this share; a box's play up this share, its wind-up down this
# (the ankles' read 0.35 low on the stand); an encoder's zero slipped past this, rad; a load
# past this, kg -; the hours between services, and the hours from one before a drift's trend
# counts toward the next.
[service]
friction = [0.5, 0.5]
viscous = [0.5, 0.3]
torque = 0.15
play = 0.8
wind_up = 0.5
zero = 0.01
load_kg = 3.0
hours = 500.0
trend_h = 1.0
