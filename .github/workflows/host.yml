# A runner probe on a temporary branch, never merged: numpy's AVX-512 dispatch off and OpenBLAS's kernel forced
# to Zen's, SandyBridge's or Haswell's on one thread - her C beside her python twins there, and her wear's matmul.
name: host

on:
  push:
    branches: [probe-twins]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
        seat: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/inputs
        with:
          apt: libegl1 libgl1-mesa-dri
          requirements: host/requirements.txt
          constraints: host/constraints.txt
          editable: host
      - name: as it is
        shell: bash
        working-directory: host
        run: |
          python -X utf8 -c "import numpy._core._multiarray_umath as m; print('dispatch:', ' '.join(m.__cpu_dispatch__))"
          python -X utf8 -c "from tools.dev import probe_twins as p; p.processor()"
      - name: Zen 
        continue-on-error: true
        shell: bash
        working-directory: host
        env:
          MUJOCO_GL: egl
          OPENBLAS_CORETYPE: Zen
          OPENBLAS_NUM_THREADS: ''
        run: |
          export NPY_DISABLE_CPU_FEATURES="X86_V4 AVX512_ICL AVX512_SPR"
          python -X utf8 -c "from tools.dev import probe_twins as p; p.processor(); p.exact_parts()" | grep -E "corename|probe 4|pow 2|exact_host" || echo "probe exit $?"
          python -X utf8 tests/test_tick.py twins | tail -2 || echo "test_tick exit $?"
          python -X utf8 tests/test_wear.py | tail -1 || echo "test_wear exit $?"
      - name: SandyBridge 
        continue-on-error: true
        shell: bash
        working-directory: host
        env:
          MUJOCO_GL: egl
          OPENBLAS_CORETYPE: SandyBridge
          OPENBLAS_NUM_THREADS: ''
        run: |
          export NPY_DISABLE_CPU_FEATURES="X86_V4 AVX512_ICL AVX512_SPR"
          python -X utf8 -c "from tools.dev import probe_twins as p; p.processor(); p.exact_parts()" | grep -E "corename|probe 4|pow 2|exact_host" || echo "probe exit $?"
          python -X utf8 tests/test_tick.py twins | tail -2 || echo "test_tick exit $?"
          python -X utf8 tests/test_wear.py | tail -1 || echo "test_wear exit $?"
      - name: Haswell 1
        continue-on-error: true
        shell: bash
        working-directory: host
        env:
          MUJOCO_GL: egl
          OPENBLAS_CORETYPE: Haswell
          OPENBLAS_NUM_THREADS: '1'
        run: |
          export NPY_DISABLE_CPU_FEATURES="X86_V4 AVX512_ICL AVX512_SPR"
          python -X utf8 -c "from tools.dev import probe_twins as p; p.processor(); p.exact_parts()" | grep -E "corename|probe 4|pow 2|exact_host" || echo "probe exit $?"
          python -X utf8 tests/test_tick.py twins | tail -2 || echo "test_tick exit $?"
          python -X utf8 tests/test_wear.py | tail -1 || echo "test_wear exit $?"
