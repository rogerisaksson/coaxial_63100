<text x="473" y="513" fill="#94a3b8" font-size="9">active-set thrust share</text>
<text x="473" y="527" fill="#cbd5e1" font-size="9">60 A / 90 A WEP reach</text>
<text x="473" y="540" fill="#fbbf24" font-size="9">out: 4x rotor rad/s</text>
<line x1="757" y1="472" x2="757" y2="484" stroke="#fbbf24" stroke-width="1.8"/>
