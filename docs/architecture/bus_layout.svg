<g font-family="monospace">
<text x="24" y="34" fill="#f8fafc" font-size="16" font-weight="bold">COAXIAL 63100 -- 5x 10 Mbit/s RS485 Modbus RTU Extremity Buses (27 SIL Boards, 21 Driven)</text>
<text x="24" y="54" fill="#94a3b8" font-size="11">Generated from machine.edge (LIMBS, BAUD=10000000), machine.rtu (CRC-16/MODBUS), and wbc_pass.c (mb_rtu_t + mb_slave_t)</text>
<rect x="20" y="160" width="200" height="245" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
<text x="32" y="186" fill="#38bdf8" font-size="12" font-weight="bold">SOLVER &amp; SIL MASTER</text>
<text x="32" y="204" fill="#e2e8f0" font-size="10">machine.law -&gt; edge.drive</text>
<text x="32" y="220" fill="#94a3b8" font-size="10">wbc_sil_drive (1 kHz)</text>
<line x1="32" y1="232" x2="208" y2="232" stroke="#334155" stroke-width="1"/>
<text x="32" y="250" fill="#f8fafc" font-size="10" font-weight="bold">Modbus RTU Banks (0x10):</text>
<text x="32" y="268" fill="#cbd5e1" font-size="10">SETPOINT 0x0100</text>
<text x="32" y="286" fill="#cbd5e1" font-size="10">KP       0x0140</text>
<text x="32" y="304" fill="#cbd5e1" font-size="10">FEED     0x0180</text>
<text x="32" y="322" fill="#cbd5e1" font-size="10">LIMIT    0x01c0</text>
<text x="32" y="340" fill="#cbd5e1" font-size="10">STATE    0x0200</text>
<text x="32" y="358" fill="#cbd5e1" font-size="10">GATE     0x0300</text>
</g>
