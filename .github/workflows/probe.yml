name: probe

on:
  push:
    branches: [ci-probe]

jobs:
  seat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: host/requirements.txt
      - run: pip install -r host/requirements.txt && pip install --no-deps -e host
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: the base sit traced past its contact
        shell: bash
        env:
          MUJOCO_GL: egl
        run: |
          for w in 0 0.0002; do
            python .github/probe/seat_probe.py host base "$w" 1.80 4.20
          done
